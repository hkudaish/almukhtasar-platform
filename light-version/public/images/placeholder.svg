<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2744" />
      <stop offset="50%" stop-color="#16375c" />
      <stop offset="100%" stop-color="#0a192c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0f2744" stop-opacity="0" />
    </radialGradient>
    <pattern id="pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#glow)" />
  <rect width="800" height="450" fill="url(#pattern)" />

  <!-- Center News Logo / Icon -->
  <g transform="translate(400, 200)">
    <!-- Decorative Circle -->
    <circle r="56" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <circle r="46" fill="#0f2744" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.2" />

    <!-- Newspaper Vector Icon -->
    <g transform="translate(-24, -24)" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h32a2 2 0 0 1 2 2v28a2 2 0 0 1-2 2H6a4 4 0 0 1-4-4V8a2 2 0 0 1 2-2z" fill="#0a192c" />
      <path d="M12 14h16M12 20h16M12 26h10" />
      <rect x="28" y="24" width="8" height="8" rx="1" fill="#38bdf8" fill-opacity="0.2" />
    </g>

    <!-- Platform Name -->
    <text y="90" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', 'Noto Sans Arabic', sans-serif" font-size="28" font-weight="800" letter-spacing="1">المُخْتَصَر</text>
    <text y="118" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', 'Noto Sans Arabic', sans-serif" font-size="14" font-weight="500">منصة الأخبار الذكية</text>
  </g>
</svg>
